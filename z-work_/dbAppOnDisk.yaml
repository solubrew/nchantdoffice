---
<(META)>:
  docid: <^[uuid]^>
  name: App On Disk Database
  description: >
    The Application stores preferences and connections to each file used as well
    as a list of contacts held as remote users of each file that has been shared
    this list doesn't enable authorization but only as a quickly lookup for
    future sharing...actually that shouldn't be added until Pyffice...need to
    break down usage...extending functionality for pyffice
  expirary: <[expiration]>
  version: <[version]>
  path: <[LEXIvrs]>
  outline: <[outline]>
  authority: document|this
  security: sec|lvl2
  <(WT)>: -32
'tables':
  cache:
    'name':
    'description': >
      App Cache table is used for holding data moved down from the AppInMem and
      SharedInMem databases this is heavily used during a crash or fast shutdown but also
      to a lesser extent during normal operation of moving shuttling data from
      the AppInMem and SharedInMem databases
    'columns':
      'cacheid':
        'DType': 'INTEGER'
        'Options': PRIMARY KEY ON CONFLICT ROLLBACK AUTOINCREMENT UNIQUE NOT NULL
      'cachedtid':
        'DType': 'TEXT'
        'Options':
      'docuuid':
        'DType': 'TEXT'
      '<@[column]@>':
        'DType': 'TEXT'
      'creby':
        'DType': 'INTEGER'
        'Options':
      'creon':
        'DType': 'TEXT'
        'Options':
      'modbY':
        'DType': 'INTEGER'
        'Options': INTEGER'
      'modon':
        'DType': 'TEXT'
        'Options':
      'dlt':
        'DType': 'BOOLEAN'
        'Constraints': NOT NULL DEFAULT (0)'
        'Options':
      'actv':
        'DType': 'BOOLEAN'
        'Options': NOT NULL DEFAULT (1)'
  'docbs':
    'description': >
      Docbs stores the databases actively connected from Pyffice. Allow for a
      Project DocB config file to be loaded change all actively connected
      Pyffice files
    'terms':
    'columns':
      dbid:
        'DType': 'INTEGER'
        'Options': PRIMARY KEY ON CONFLICT ROLLBACK AUTOINCREMENT UNIQUE NOT NULL
      dbuuid:
        'DType': 'TEXT'
        'Options':
      name:
        'DType': 'TEXT'
        'Options':
      sessionuuid:
        'DType': 'TEXT'
        'Options':
      'creby':
        'DType': 'INTEGER'
        'Options':
      'creon':
        'DType': 'TEXT'
        'Options':
      'modbY':
        'DType': 'INTEGER'
        'Options': INTEGER'
      'modon':
        'DType': 'TEXT'
        'Options':
      'dlt':
        'DType': 'BOOLEAN'
        'Constraints': NOT NULL DEFAULT (0)'
        'Options':
      'actv':
        'DType': 'BOOLEAN'
        'Options': NOT NULL DEFAULT (1)'
  'fx':
    description: >
    columns:
      'fxid':
        'DType': 'INTEGER'
        'Options': PRIMARY KEY ON CONFLICT ROLLBACK AUTOINCREMENT UNIQUE NOT NULL
      'fxuuid':
      'creby':
        'DType': 'INTEGER'
        'Options':
      'creon':
        'DType': 'TEXT'
        'Options':
      'modbY':
        'DType': 'INTEGER'
        'Options': INTEGER'
      'modon':
        'DType': 'TEXT'
        'Options':
      'dlt':
        'DType': 'BOOLEAN'
        'Constraints': NOT NULL DEFAULT (0)'
        'Options':
      'actv':
        'DType': 'BOOLEAN'
        'Options': NOT NULL DEFAULT (1)'
  'opt':
    'description': >
    'terms':
    'columns':
      'optid':
        'DType': 'INTEGER'
        'Options': PRIMARY KEY ON CONFLICT ROLLBACK AUTOINCREMENT UNIQUE NOT NULL
      'uuid':
        DType: 'TEXT'
      'name':
        DType: 'TEXT'
      '[table]':
        DType: 'TEXT'
      'tbloptionid':
        DType: 'INTEGER'
      'type':
        DType: INTEGER'
      'description':
        DType: 'BLOB'
      'extension':
        DType: 'TEXT'
      'creby':
        'DType': 'INTEGER'
        'Options':
      'creon':
        'DType': 'TEXT'
        'Options':
      'modbY':
        'DType': 'INTEGER'
        'Options': INTEGER'
      'modon':
        'DType': 'TEXT'
        'Options':
      'dlt':
        'DType': 'BOOLEAN'
        'Constraints': NOT NULL DEFAULT (0)'
        'Options':
      'actv':
        'DType': 'BOOLEAN'
        'Options': NOT NULL DEFAULT (1)'
  'perf':
    name: '_perf'
    description: >
      The _perf Table will hold information that tracks and optimizes the
      performance of the running instance FxSQuRIL Track # of transactions by
      table and db store the size of the transactions and the overall size of
      the db try to determine working ranges of data some tables maybe large
      but typically only work with the first x rows or most recent or specific
      view
    'tmplt':
      'metrics':
        files:
          -
            name:
            lastOpen:
            lastPath:
        bgTbl:
          size: [cols, rows, versions]
        state: saved, crashed, closed, cleaned
        score: <[session_perf]>
    'terms':
    'columns':
      perfid:
        'DType': 'INTEGER'
        'Options': PRIMARY KEY ON CONFLICT ROLLBACK AUTOINCREMENT UNIQUE NOT NULL
      perfuuid:
        'DType': 'TEXT'
        'Options':
      data:
      'creby':
        'DType': 'INTEGER'
        'Options':
      'creon':
        'DType': 'TEXT'
        'Options':
      'modbY':
        'DType': 'INTEGER'
        'Options': INTEGER'
      'modon':
        'DType': 'TEXT'
        'Options':
      'dlt':
        'DType': 'BOOLEAN'
        'Options': 'NOT NULL DEFAULT (0)'
      'actv':
        'DType': 'BOOLEAN'
        'Options': 'NOT NULL DEFAULT (1)'
  'usr':
    'description': >
    'terms':
    'columns':
      'usrid':
        'DType': 'INTEGER'
        'Options': PRIMARY KEY ON CONFLICT ROLLBACK AUTOINCREMENT UNIQUE NOT NULL
      'usruuid':
        'DType': 'TEXT'
        'Options':
      'name':
        'DType': 'TEXT'
        'Options':
      'sessionuuid':
        'DType': 'TEXT'
        'Options':
      'creon':
        'DType': 'TEXT'
        'Options':
      'modbY':
        'DType': 'INTEGER'
        'Options': INTEGER'
      'modon':
        'DType': 'TEXT'
        'Options':
      'dlt':
        'DType': 'BOOLEAN'
        'Options': 'NOT NULL DEFAULT (0)'
      'actv':
        'DType': 'BOOLEAN'
        'Options': 'NOT NULL DEFAULT (1)'
views:
  DocGroups:
    cmd: >
  Docs:
    cmd: >
  DocStates:
    cmd: >
  fullDoc:
    cmd: >
  FileTypes:
    cmd: >
      CREATE VIEW Filetypes AS
      SELECT
        *
      FROM _opt
      WHERE Type = 'FILE'
      ORDER BY
        [Table] ASC,
        tblOptionID ASC;
  fullTable:
    cmd: >
      CREATE VIEW fullTable AS
      SELECT
        *
      FROM t_docs
      INNER JOIN t_sectns ON t_docs.sectnUUID = t_sectns.SectnUUID
      ORDER BY
        t_docs.DocID ASC,
        t_docs.Seq ASC;
  SectnsWLookup:
    cmd: >
      CREATE VIEW SectnsWLookup AS
      SELECT
        *
      FROM t_sectns
      INNER JOIN (
        SELECT
          _opt.tblOptionID,
          _opt.Name
        FROM _opt
        WHERE Type = 'File'
      ) AS ftype ON t_sectns.Type = ftype.tblOptionID;
  shrPair:
    cmd: >
      CREATE VIEW shrPair AS
      SELECT
        *
      FROM t_docs;
  uniqueSectnHASH:
    cmd: >
      CREATE VIEW unqiueSectnHASH AS
      SELECT
        hex([Text]) AS [HEX]
      FROM t_sectns
      GROUP BY
        [HEX];
  v_doc:
    cmd: >
      CREATE VIEW v_doc AS
      SELECT
        *
      FROM t_docs
      INNER JOIN t_sectns ON t_docs.sectnUUID = t_sectns.SectnUUID
      WHERE t_docs.Name = 'tkSheet'
      ORDER BY t_docs.Seq ASC;
  AppOnDiskDB:
    'tables':
      _cache:
        'name':
        'description': >
        'columns':
          'cachedtid':
            'DType': 'TEXT'
            'Options':
          'docuuid':
            'DType': 'TEXT'
            'Options':
      '_docs':
        'name': '_doc'
        'description': >
          'Store Entries to Organize Sections into a Document allowing for proper formatting'
          'and versioning for the document sections'
          'A Doc is a tree of Sectn sequences...the branches provide for different views'
          'of the same document like values, formulas, formats'
        'terms':
          '<[table]>': '_doc'
          '<@[columns]@>:
            - 'histTag.: TEXT'
            - 'Name.: TEXT'
            - 'Seq.: TEXT'
            - 'SectnUUID.: TEXT'
            - 'DTID.: TEXT'
            - 'ownrUUID.: TEXT'
            - '[Group].: TEXT'
      '_msgs':
        'name': '_msg'
        'description': >
          'Handle in app messages for collaboration purposes both human and
          'machine commmunication'
          'A Message will be used to convey information between'
          'copies of the file and users...a seperate mechism of'
          'storage will be used for speed to help with concurrency'
          'syncing across networks'
        'terms':
          '<[table]>': '_msg'
          '<@[columns]@>':
            - 'From.: TEXT'
            - 'To.: TEXT'
            - 'Body.: TEXT'
            - 'Anchor.: TEXT'
            - 'Channel.: TEXT'
            - 'Note.: TEXT'
            - 'State.: TEXT'
      '_opts':
        'name': '_opt'
        'description': >
        'terms':
          '<[table]>': '_opt'
          '<@[columns]@>':
            - '<[table]>UUID.: TEXT'
            - 'Name.: TEXT'
            - '[Table].: TEXT'
            - '<[table]>ID.: INT'
            - 'tblOptionID.: INT'
            - 'Type.: INT'
            - 'Description.: BLOB'
      '_perf':
        'name': '_perf'
        'description': >
          The _perf Table will hold information that tracks and optimizes
          the performance of the running instance FxSQuRIL
          Track # of transactions by table and db
          store the size of the transactions and the overall size of the db
          try to determine working ranges of data
          some tables maybe large but typically only work with the first x rows
          or most recent or specific view
        'tmplt':
          'metrics':
            files:
              -
                name:
                lastOpen:
                lastPath:
            bgTbl:
              size: [cols, rows, versions]
            state: saved, crashed, closed, cleaned
            score: <[session_perf]>
        'terms':
          '<[table]>': '_perf'
          '<@[columns]@>':
            - <[table]>UUID
            - Data
      '_sectns':
        'name':
        'description': >
          A Sectn is a chunk of a document.  A chunk can have 2 dimensions
          rows and columns, these are combinined into a single cell for storage and light
          consumption
        'terms':
          '<[table]>': '_perf'
          '<@[columns]@>':
            - <[table.:UUID UNIQUE]>
      '_usrs':
        'name':
        'description': >
        'terms':
          '<[table]>': '_usr'
          '<@[columns]@>':
            - '<[table.:UUID]>'
            - Name
            - sessionUUID
      '_docbs':
        'name':
        'description': >
        'terms':
          '<[table]>': '_docbs'
          '<@[columns]@>':
            - <[table]>UUID
            - Name
            - sessionUUID
    views:
        DocGroups:
        Docs:
        DocStates:
        FileTypes:
        fullDoc:
