        profile: null
        trnodes:
          columns:
          - nid
          - name
          - ntype
          - parentid
          - position
          - tabset
          - treeid
          - readonly
          - editable
          - visible
          - moveable
          - pregnable
          - isparent
          - expanded
          - tabfocus
          - uuid
          description: "nid => Node ID: the unique node id for the primary tree in\
            \ the application name => Name: The display value on the node of each\
            \ branch of the tree ntype => Node Type: The application uses node types\
            \ to control overall application functionality \n                and custom\
            \ subtree usage\n      Options: [appnode, usernode]\nparentid => Parent\
            \ ID: is used to attribute children to their parents within the tree.\
            \ The 0 value represents \n                    the parent being the application\
            \ itself\n        Options: \nposition => Position: Active control of the\
            \ position of the node upon the tree. T\n                  TODO: this\
            \ is not built out for full control as needed\ntabset => Tabset Widget\
            \ name that the node will launch upon getting focus treeid => Tree ID:\
            \ the treeid  readonly => Read Only:  editable => Editable:  visible =>\
            \ Visible:  moveable => Moveable:  pregnable => Pregnable:  isparent =>\
            \ Is Parent:  expanded => Expanded: tabfocus => Tab Focus:\n  possibly\
            \ build this up for use in the application instead of relying\n  on the\
            \ more dynamic build within the configuration, use the treeid\n  to allow\
            \ for virtual trees to allow for reuse of the node\n  design such that\
            \ when adding a node to a subtree a decision is made\n  whether or not\
            \ to bring the subtree? but this duplicates all entries\n  of the tree\n\
            \n  implement virtual tree system by include a node type of vtree\n  where\
            \ a vtree nodes name is the real node nid of the virtual node\n  nid=1,\
            \ name='Fred', ntype=tree, pid=0, treeid=0\n  nide=2, name=1, ntype=vtree,\
            \ pid=1, treeid=0\n\n  implement multiparent node tree system by connecting\
            \ to\n  parents table\n"
          fields:
            ntype:
              expected_values:
              - node
              - vnode
              - mpnode
          records: []
      view:
        VW_ACTOR:
          cmd: "CREATE VIEW VW_ACTOR AS\n  SELECT\n    a.ACTOR_PK,\n    a.NAME_TXT,\n\
            \    a.NAME_ABBR\n  FROM ACTOR a\n  WHERE a.ACTIVE_BIT = 1 AND a.DELETE_BIT\
            \ = 0\n  GROUP BY 1,2,3\n"
          description: null
        VW_CONCERN:
          cmd: "CREATE VIEW VW_CONCERN AS\n  SELECT\n    c.CONCERN_PK,\n    c.NAME_TXT\
            \ AS CONCERN_NM\n  FROM CONCERN c\n  WHERE c.ACTIVE_BIT = 1 AND c.DELETE_BIT\
            \ = 0\n  GROUP BY 1\n"
          description: null
        VW_DAILY_15MIN_TRACKER:
          cmd: null
          description: null
        VW_DETAIL_TASK:
          cmd: null
          description: null
        VW_DUE:
          cmd: "CREATE VIEW VW_DUE AS\n  SELECT\n    d.DUE_PK,\n    d.TODO_FK,\n \
            \   d.DUE_CHANGE_DTTM,\n    d.DUE_DTTM\n  FROM DUE d\n  WHERE d.ACTIVE_BIT\
            \ = 1 AND d.DELETE_BIT = 0\n  GROUP BY 1,2,3,4\n"
          description: null
        VW_DUE_CURRENT:
          cmd: "CREATE VIEW VW_DUE_CURRENT AS \n  SELECT\n    d.TODO_FK,\n    d.DUE_DTTM\n\
            \  FROM VW_DUE d\n  WHERE (d.TODO_FK, d.DUE_CHANGE_DTTM) = (\n    SELECT\
            \ TODO_FK, MAX(DUE_CHANGE_DTTM) \n    FROM VW_DUE\n  )\n  GROUP BY 1,2\n"
          description: null
        VW_GANTT_TASK:
          cmd: null
          description: null
        VW_MONTHLY_CALENDAR:
          cmd: null
          description: null
        VW_MULTIWEEK_CALENDAR:
          cmd: null
          description: null
        VW_TABS:
          cmd: "SELECT\n  tb.TABS_PK,\n  tb.NAME,\n  tb.WIDGET,\n  tb.WIDGDATA,\n\
            \  tb.PARENTID,\n  tb.POSITION,\n  tb.READONLY,\n  tb.EDITABLE,\n  tb.VISIBLE,\n\
            \  tb.MOVEABLE,\n  tb.UUID\nFROM TABS tb WHERE tb.ACTIVE_BIT = 1 AND tb.DELETE_BIT\
            \ = 0 AND tb.ARCHIVE_BIT = 0\n"
          decription: null
        VW_TODO:
          cmd: "CREATE VIEW VW_TODO AS \n  SELECT\n    t.TODO_PK,\n    t.NAME_TXT,\n\
            \    t.DESCRIPTION_LTXT,\n    t.CONCERN_FK,\n    t.DUE_FK\n  FROM TODO\
            \ t\n  WHERE t.ACTIVE_BIT = 1 AND t.DELETE_BIT = 0\n  GROUP BY 1,2,3,4\n"
          description: null
        VW_TODO_CURRENT:
          cmd: "CREATE VIEW VW_TODO_CURRENT AS\n  SELECT\n    t.NAME_TXT, \n    t.DESCRIPTION_LTXT,\
            \ \n    a.NAME_TXT AS RESPONSIBLE_ACTOR_NM,\n    a.NAME_ABBR AS RESPONSIBLE_ACTOR_ABBR,\n\
            \    c.CONCERN_NM, \n    d.DUE_DTTM\n  FROM VW_TODO t\n  INNER JOIN VW_CONCERN\
            \ c ON c.CONCERN_PK = t.CONCERN_FK\n  INNER JOIN VW_DUE d ON d.TODO_FK\
            \ = t.TODO_PK\n  INNER JOIN VW_ACTOR a ON t.ACTOR_FK = a.ACTOR_PK\n  GROUP\
            \ BY 1,2,3,4\n"
          description: null
        VW_TRNODES:
          cmd: "SELECT\n  tr.TRNODES_PK,\n  tr.NID,\n  tr.NAME,\n  tr.NTYPE,\n  tr.PARENTID,\n\
            \  tr.POSITION,\n  tr.TABSET,\n  tr.TREEID,\n  tr.READONLY,\n  tr.EDITABLE,\n\
            \  tr.VISIBLE,\n  tr.MOVEABLE,\n  tr.PREGNABLE,\n  tr.ISPARENT,\n  tr.EXPANDED,\n\
            \  tr.TABFOCUS,\n  tr.UUID\nFROM TRNODES tr WHERE tr.ACTIVE_BIT = 1 AND\
            \ tr.DELETE_BIT = 0 AND tr.ARCHIVE_BIT = 0\n"
          description: null
        VW_WEEKLY_CALENDAR:
          cmd: null
          description: null
        vw_last_node:
          cmd: "CREATE VIEW vw_last_node AS\n  SELECT\n    max(nid) as lastnode\n\
            \  FROM trnodes\n"
          description: 'Return the max nid in the nodes table

            '
        vw_multiparent_nodes:
          cmd: "CREATE VIEW\n  SELECT\n    nid, name, ntype, parentid, position, tabset,\
            \ treeid,\n    readonly, editable, visible, moveable, pregnable,\n   \
            \ isparent, expanded\n  FROM trnodes n\n  WHERE ntype = 'mpnode'\n"
          description: ''
        vw_nodes:
          cmd: "CREATE VIEW\n  SELECT\n    nid, name, ntype, parentid, position, tabset,\
            \ treeid,\n    readonly, editable, visible, moveable, pregnable,\n   \
            \ isparent, expanded, 'tabfocus'\n  FROM trnodes n\n  WHERE ntype = 'node'\n"
          description: ''
        vw_virtual_nodes:
          cmd: "CREATE VIEW\n  SELECT\n    nid, name, ntype, parentid, position, tabset,\
            \ treeid,\n    readonly, editable, visible, moveable, pregnable,\n   \
            \ isparent, expanded\n  FROM trnodes n\n  WHERE ntype = 'vnode'\n"
          description: ''
