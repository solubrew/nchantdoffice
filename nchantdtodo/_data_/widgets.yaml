---
<(META)>:
  docid:
  name:
  description: >
  expirary: '<[expiration]>'
  version: '<[version]>'
  path: '<[LEXIvrs]>panda/LEXI/'
  outline: '<[outline]>'
  authority: 'document|this'
  security: 'sec|lvl2'
  <(WT)>: -32
NTDTaskInputTab:
  'title': 'Nchantd Input'
  description: >
    A single pane dialog box with a form to enter a simple TODO
  fields:
    'NAME_TXT':
      default:
      label: 'Task:'
      store: DB.TODO|TODO_PK
      grid: 0|0
      size:
        'h': 1
        'w': 50
      widget: 'nchantrs.widgets.editors.NchantdEntryEditor'
    'DESCRIPTION_LTXT':
      grid: 1
      'label': 'Description:'
      'default':
      'size':
        'h': 10
        'w': 50
      store: DB.TODO|TODO_PK
      widget: 'nchantrs.widgets.editors.NchantdEntryEditor'
    RESOURCE_ASSIGNMENT_FK:

    'WORK_HOUR_ESTIMATE_NBR':
      label: 'Hours:'
      default:
      grid: 0|1
      size:
        h: 10
        w: 50
      store: DB.TODO|TODO_PK
      widget: 'nchantrs.widgets.editors.NchantdEntryEditor'
    'CONCERN_TXT':
      grid: 0|2
      'default':
        - JDB
        - SB
        - WSB
        - UI
        - NK
      label: 'Concern:'
      'size':
        'h': 1
        'w': 50
      store: DB.TODO.CONCERN_FK|TODO_PK
      options: DB.VW_CONCERN.NAME_TXT
      widget: 'nchantrs.widgets.editors.NchantdDropDown'
    'DUE_DT':
      grid: 2
      label: 'Due Date:'
      store: DB.DUE.DUE_DT|TODO_FK|NOW
      default:
      size:
        'h': 1
        'w': 50
      widget: 'nchantrs.widgets.calendars.NchantdDateSelect'
  #if this view is provided to the widget what about multi widget views
  # or panes with multiple widgets
  source: db.VW_TODO_CURRENT|TODO_PK
