name: Documentation

on:
  push:
    branches: [main, gamma]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mkdocs mkdocs-material mkdocstrings
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
