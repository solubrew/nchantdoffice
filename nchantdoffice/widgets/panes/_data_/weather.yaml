NchantdWeatherPane:
    html: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Animated Weather Display</title>
            <style>
                body {
                    margin: 0;
                    padding: 0;
                    font-family: Arial, sans-serif;
                    background: linear-gradient(135deg, #74ebd5, #acb6e5);
                    height: 100vh;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }

                .weather-container {
                    background: rgba(255, 255, 255, 0.1);
                    border-radius: 20px;
                    padding: 30px;
                    backdrop-filter: blur(10px);
                    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
                    text-align: center;
                    color: #fff;
                    min-width: 300px;
                }

                .weather-icon {
                    width: 100px;
                    height: 100px;
                    margin: 0 auto;
                    animation: bounce 2s infinite;
                }

                .temperature {
                    font-size: 48px;
                    margin: 20px 0;
                    font-weight: bold;
                }

                .description {
                    font-size: 24px;
                    text-transform: capitalize;
                }

                .location {
                    font-size: 18px;
                    margin-top: 10px;
                    opacity: 0.8;
                }

                @keyframes bounce {
                    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
                    40% { transform: translateY(-20px); }
                    60% { transform: translateY(-10px); }
                }

                @keyframes fadeIn {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }

                .weather-container {
                    animation: fadeIn 1s ease-in;
                }

                .rain {
                    background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmI0YjQ5YzQ5YzQ5YzQ5YzQ5YzQ5YzQ5YzQ5YzQ5YzQ5YzQ5YzQ5Yw&rid=giphy.gif') center;
                    background-size: cover;
                }

                .sun {
                    background: radial-gradient(circle, #ffeb3b, #ff9800);
                }

                .clouds {
                    background: linear-gradient(135deg, #b0bec5, #78909c);
                }
            </style>
        </head>
        <body>
            <div class="weather-container" id="weatherContainer">
                <div class="weather-icon" id="weatherIcon"></div>
                <div class="temperature" id="temperature"></div>
                <div class="description" id="description"></div>
                <div class="location" id="location"></div>
            </div>

            <script>
                const apiKey = 'YOUR_API_KEY';  // Replace with your OpenWeatherMap API key
                const city = 'London';         // Change to your desired city
                const url = <[url]>;

                async function getWeather() {
                    try {
                        const response = await fetch(url);
                        const data = await response.json();

                        document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
                        document.getElementById('description').textContent = data.weather[0].description;
                        document.getElementById('location').textContent = `${data.name}, ${data.sys.country}`;

                        const weatherCondition = data.weather[0].main.toLowerCase();
                        const weatherContainer = document.getElementById('weatherContainer');
                        const weatherIcon = document.getElementById('weatherIcon');

                        switch(weatherCondition) {
                            case 'clear':
                                weatherIcon.innerHTML = '☀️';
                                weatherContainer.classList.add('sun');
                                break;
                            case 'clouds':
                                weatherIcon.innerHTML = '☁️';
                                weatherContainer.classList.add('clouds');
                                break;
                            case 'rain':
                                weatherIcon.innerHTML = '🌧️';
                                weatherContainer.classList.add('rain');
                                break;
                            default:
                                weatherIcon.innerHTML = '🌤️';
                        }
                    } catch (error) {
                        console.error('Error fetching weather data:', error);
                        document.getElementById('temperature').textContent = 'Error loading weather';
                    }
                }

                window.onload = getWeather;
            </script>
        </body>
        </html>
