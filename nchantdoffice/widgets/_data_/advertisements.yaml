NchantdOfficeAdTab:
  # DESK T-NEW-061: replaced the previous local-slot rotation
  # (12 s) with a server-driven rotation that re-asks the
  # server every ``surface_interval_ms``. The server picks
  # the ad; the desktop just renders whatever comes back.
  # Default is 300_000 ms (5 minutes) when this key is absent
  # — see ``DEFAULT_SURFACE_INTERVAL_MS`` in advertisements.py.
  surface_interval_ms: 300000
