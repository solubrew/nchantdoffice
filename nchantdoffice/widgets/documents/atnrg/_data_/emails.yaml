# nchantdoffice Email Client Configuration
# ============================================

NchantdOfficeEmail:
    # Default settings
    default_provider: "gmail"
    
    # Email server settings templates
    providers:
        gmail:
            imap_host: "imap.gmail.com"
            imap_port: 993
            smtp_host: "smtp.gmail.com"
            smtp_port: 587
            use_ssl: true
        outlook:
            imap_host: "outlook.office365.com"
            imap_port: 993
            smtp_host: "smtp.office365.com"
            smtp_port: 587
            use_ssl: true
        yahoo:
            imap_host: "imap.mail.yahoo.com"
            imap_port: 993
            smtp_host: "smtp.mail.yahoo.com"
            smtp_port: 587
            use_ssl: true
        custom:
            imap_host: ""
            imap_port: 993
            smtp_host: ""
            smtp_port: 587
            use_ssl: true
    
    # Toolbox configuration
    toolbox:
        100:
            title: Account
            items:
                0: {"action": "add_account", "type": "button", "label": "Add Account"}
                1: {"action": "remove_account", "type": "button", "label": "Remove Account"}
                2: {"action": "account_selector", "type": "dropdown"}
                3: {"action": "account_email", "type": "entry", "label": "Email:"}
                4: {"action": "account_password", "type": "password", "label": "Password:"}
                5: {"action": "account_provider", "type": "dropdown", "label": "Provider:"}
                6: {"action": "account_test", "type": "button", "label": "Test Connection"}
        
        200:
            title: Compose
            items:
                0: {"action": "new_email", "type": "button", "label": "New Email"}
                1: {"action": "reply_email", "type": "button", "label": "Reply"}
                2: {"action": "reply_all", "type": "button", "label": "Reply All"}
                3: {"action": "forward_email", "type": "button", "label": "Forward"}
                4: {"action": "save_draft", "type": "button", "label": "Save Draft"}
                5: {"action": "send_email", "type": "button", "label": "Send"}
        
        300:
            title: Folders
            items:
                0: {"action": "folder_inbox", "type": "button", "label": "Inbox"}
                1: {"action": "folder_sent", "type": "button", "label": "Sent"}
                2: {"action": "folder_drafts", "type": "button", "label": "Drafts"}
                3: {"action": "folder_trash", "type": "button", "label": "Trash"}
                4: {"action": "folder_archive", "type": "button", "label": "Archive"}
                5: {"action": "folder_spam", "type": "button", "label": "Spam"}
        
        400:
            title: Actions
            items:
                0: {"action": "delete_email", "type": "button", "label": "Delete"}
                1: {"action": "archive_email", "type": "button", "label": "Archive"}
                2: {"action": "mark_read", "type": "button", "label": "Mark Read"}
                3: {"action": "mark_unread", "type": "button", "label": "Mark Unread"}
                4: {"action": "mark_starred", "type": "button", "label": "Star"}
                5: {"action": "move_to_folder", "type": "dropdown", "label": "Move to:"}
        
        500:
            title: Search
            items:
                0: {"action": "search_entry", "type": "entry", "label": "Search:"}
                1: {"action": "search_button", "type": "button", "label": "Search"}
                2: {"action": "search_filter", "type": "dropdown", "label": "Filter:"}
        
        600:
            title: Settings
            items:
                0: {"action": "sync_interval", "type": "spinbox", "label": "Sync Interval (min):"}
                1: {"action": "auto_sync", "type": "checkbox", "label": "Auto Sync"}
                2: {"action": "signature", "type": "textbox", "label": "Signature:"}
                3: {"action": "default_font", "type": "dropdown", "label": "Default Font:"}
                4: {"action": "clear_cache", "type": "button", "label": "Clear Cache"}

NchantdOfficeEmailComposer:
    # Email composer window settings
    default_font: "Arial"
    default_font_size: 12
    default_priority: "normal"
    
    toolbar:
        100:
            title: Formatting
            items:
                0: {"action": "bold", "type": "button"}
                1: {"action": "italic", "type": "button"}
                2: {"action": "underline", "type": "button"}
                3: {"action": "font_family", "type": "dropdown"}
                4: {"action": "font_size", "type": "dropdown"}
        
        200:
            title: Insert
            items:
                0: {"action": "insert_link", "type": "button"}
                1: {"action": "insert_image", "type": "button"}
                2: {"action": "insert_attachment", "type": "button"}
                3: {"action": "insert_table", "type": "button"}
        
        300:
            title: Actions
            items:
                0: {"action": "attach_file", "type": "button"}
                1: {"action": "attach_contact", "type": "button"}
                2: {"action": "set_priority", "type": "dropdown"}

NchantdOfficeEmailViewer:
    # Email viewer settings
    show_headers: false
    show_raw: false
    
    toolbar:
        100:
            title: Email Actions
            items:
                0: {"action": "reply", "type": "button"}
                1: {"action": "reply_all", "type": "button"}
                2: {"action": "forward", "type": "button"}
                3: {"action": "print", "type": "button"}
        
        200:
            title: View Options
            items:
                0: {"action": "show_headers", "type": "checkbox"}
                1: {"action": "show_raw", "type": "button"}
                2: {"action": "save_attachment", "type": "button"}
