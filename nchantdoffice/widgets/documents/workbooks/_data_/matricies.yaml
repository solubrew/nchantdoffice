NchantdOfficeCellBorderSigil:
  button_bar:
    cell_border_left_active:
    cell_border_left_color:
    cell_border_left_width:
    cell_border_left_style:
    cell_border_top_active:
    cell_border_top_color:
    cell_border_top_style:
    cell_border_right_active:
    cell_border_right_color:
    cell_border_right_width:
    cell_border_right_style:
    cell_border_bottom_active:
    cell_border_bottom_color:
    cell_border_bottom_width:
    cell_border_bottom_style:

# File handling
excel:
  default_extension: .xlsx
  supported_formats:
    - .xlsx  # Excel 2007+
    - .xls   # Excel 97-2003
    - .csv   # Comma-separated values
    - .tsv   # Tab-separated values

  load:
    preserve_formulas: true
    preserve_formatting: true
    preserve_merged_cells: true
    preserve_comments: false
    data_only: false  # If true, loads calculated values instead of formulas

  save:
    preserve_formulas: true
    preserve_formatting: true
    preserve_merged_cells: true

# Spreadsheet defaults
defaults:
  rows: 100
  columns: 26  # A-Z
  row_height: 20
  column_width: 80
  font_family: "Segoe UI"
  font_size: 10

# Formula engine
formulas:
  enabled: true
  max_recursion_depth: 100
  supported_functions:
    - SUM
    - AVERAGE
    - COUNT
    - MAX
    - MIN
    - IF
    - VLOOKUP
    - HLOOKUP
    - CONCATENATE
    - LEFT
    - RIGHT
    - MID
    - LEN
    - TRIM
    - ROUND
    - ABS
    - SQRT
    - POWER
    - NOW
    - TODAY
    - YEAR
    - MONTH
    - DAY

# Cell formatting
formatting:
  number_formats:
    currency: "$#,##0.00"
    percentage: "0.00%"
    date: "yyyy-mm-dd"
    time: "hh:mm:ss"
    decimal: "#,##0.00"

  colors:
    header_bg: "#E0E0E0"
    header_fg: "#000000"
    alt_row_bg: "#F5F5F5"
    selection_bg: "#0078D4"
    selection_fg: "#FFFFFF"

# UI Configuration
ui:
  show_formula_bar: true
  show_row_numbers: true
  show_column_letters: true
  alternating_row_colors: true
  grid_lines: true
  freeze_panes: false
