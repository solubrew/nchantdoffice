[project.optional-dependencies]
# Optional but commonly-installed dependencies
# ``pdf`` and ``spreadsheet`` are referenced by media/pdfs.py and
# workbooks/matricies.py via try/except ImportError so users without
# these features don't get import-time errors.
pdf = [
    "pypdf>=3.0.0",
]
spreadsheet = [
    "openpyxl>=3.1.0",
]
# Internal projects (peer SB packages). Install with:
#   pip install nchantdoffice[internal]
internal = [
    "nchantrs @ file:///mnt/overse/SBST01/vein/GitVein/nchantrs.git@gamma",
    "pyffice @ file:///mnt/overse/SBST01/vein/GitVein/pyffice.git@gamma",
    "kahndor @ file:///mnt/overse/SBST01/vein/GitVein/kahndor.git@gamma",
    "subtrix @ file:///mnt/overse/SBST01/vein/GitVein/subtrix.git@gamma",
    "micromole @ file:///mnt/overse/SBST01/vein/GitVein/micromole.git@gamma",
    "squirl @ file:///mnt/overse/SBST01/vein/GitVein/squirl.git@gamma",
    "pycurity @ file:///mnt/overse/SBST01/vein/GitVein/pycurity.git@gamma",
    "thingery @ file:///mnt/overse/SBST01/vein/GitVein/thingery.git@gamma",
    #"metrologic @ file:///mnt/overse/SBST01/vein/GitVein/metrologic.git@gamma", # PUSH to 0.1.0 NchantdAnalytics
]
# All optional dependencies
all = [
    "pypdf>=3.0.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"
Changelog = "CHANGELOG.rst"

[project.scripts]
nchantdoffice = "nchantdoffice.__main__:main"
nchantdoffice-cli = "nchantdoffice.cli:cli"

[tool.setuptools]
include-package-data = true

#[tool.nchantrs.versioning]
#internal-version = "0.0.1.0.1.1"
#public-version = "0.0.1.0.1.1"
#version-mapping = "parts[0].parts[1].parts[2]"
#version = "0.0.1.0.1.2"
# Flat layout: project root contains "nchantrs" and a sibling "test_nchantrs".
# Limit discovery to only the actual package.
[tool.setuptools.packages.find]
where = ["."]
include = ["nchantdoffice", "nchantdoffice.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]
[tool.setuptools.package-data]
# keys are package names; globs are relative to the package dirs
nchantdoffice = [
  "**/*.yaml", "**/*.qss", "**/*.svg", "**/*.png"
]
[tool.black]
line-length = 120
skip-string-normalization = false

# Flake8 configuration
[tool.flake8]
exclude = [
    ".tox",
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "htmlcov",
    "*/static/salt/formulas/*"]
ignore = ["FI15", "FI16", "FI17", "FI5", "D107"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
mock_use_standalone_module = true
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "__pycache__",
    "dist",
    "build",
    "htmlcov",
    "tests/unit",
    "tests/fixtures",
]
# Legacy auto-generated test templates under tests/unit/ are
# pure boilerplate (the only real test is tests/test_document_opening.py).
# Until they are replaced with real assertions they should be skipped
# from the active test set so the rest of the suite can run.
addopts = [
    "-rxEfsw",
    "--tb=short",
    "--ignore=tests/unit",
]
