[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nchantdoffice"
version = "0.0.1.0.1.3"
#dynamic = ["version"]
description = "Your project description"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
authors = [{ name = "Maintainers", email = "solubrew@solutionsbrewer.com" }]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities"]
# Dependencies with environment markers preserved from the original config
dependencies = [
    "backoff",
    "click",
    'defusedxml; platform_system == "Windows"',
    'futures; python_version < "3"',
    'six; platform_system == "Linux" and python_version > "3.3"',
    'pypiwin32; platform_system == "Windows"',
    'wheel<=0.29.0; python_version < "2.7"',
    'pandas',
'sweetviz',
'PySide6',
'pytz',
'tzdata',
'six',
'shiboken6',
'numpy',
'python-dateutil',
'PySide6-Essentials',
'PySide6-Addons',
