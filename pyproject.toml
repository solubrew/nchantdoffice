[project.optional-dependencies]
# Optional but commonly-installed dependencies
# ``pdf`` and ``spreadsheet`` are referenced by media/pdfs.py and
# workbooks/matricies.py via try/except ImportError so users without
# these features don't get import-time errors.
pdf = [
    "pypdf>=3.0.0",
]
spreadsheet = [
    "openpyxl>=3.1.0",
]
# Internal projects (peer SB packages). Install with:
#   pip install nchantdoffice[internal]
internal = [
    "nchantrs @ file:///mnt/overse/SBST01/vein/GitVein/nchantrs.git@gamma",
    "pyffice @ file:///mnt/overse/SBST01/vein/GitVein/pyffice.git@gamma",
    "kahndor @ file:///mnt/overse/SBST01/vein/GitVein/kahndor.git@gamma",
    "subtrix @ file:///mnt/overse/SBST01/vein/GitVein/subtrix.git@gamma",
    "micromole @ file:///mnt/overse/SBST01/vein/GitVein/micromole.git@gamma",
    "squirl @ file:///mnt/overse/SBST01/vein/GitVein/squirl.git@gamma",
    "pycurity @ file:///mnt/overse/SBST01/vein/GitVein/pycurity.git@gamma",
    "thingery @ file:///mnt/overse/SBST01/vein/GitVein/thingery.git@gamma",
    "pyside6pandas @ file:///mnt/overse/SBST01/vein/GitVein/pyside6pandas.git@gamma",
    #"metrologic @ file:///mnt/overse/SBST01/vein/GitVein/metrologic.git@gamma", # PUSH to 0.1.0 NchantdAnalytics
]
# All optional dependencies
all = [
    "pypdf>=3.0.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"
Changelog = "CHANGELOG.rst"

[project.scripts]
nchantdoffice = "nchantdoffice.__main__:main"
nchantdoffice-cli = "nchantdoffice.cli:cli"

[tool.setuptools]
include-package-data = true

#[tool.nchantrs.versioning]
#internal-version = "0.0.1.0.1.1"
#public-version = "0.0.1.0.1.1"
#version-mapping = "parts[0].parts[1].parts[2]"
#version = "0.0.1.0.1.2"
# Flat layout: project root contains "nchantrs" and a sibling "test_nchantrs".
# Limit discovery to only the actual package.
[tool.setuptools.packages.find]
where = ["."]
include = ["nchantdoffice", "nchantdoffice.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]
[tool.setuptools.package-data]
# keys are package names; globs are relative to the package dirs
nchantdoffice = [
  "**/*.yaml", "**/*.qss", "**/*.svg", "**/*.png"
]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

# Per-file overrides for stub TEST files awaiting foliation.
# These files reference names like test_000 (sentinel),
# _NCHANTDOFFICE_KNOWN_DEAD (always-assigned-elsewhere)
# and PySide6 classes as if they were inside a class.
# Real fixes require promoting each stub into its proper class.
[tool.ruff.lint.per-file-ignores]

# CLI scripts in cmds/ — often have missing imports or use-after-import
# patterns that the auditor flags but the project doesn't care about.
"cmds/**/*.py" = ["F821", "E402", "W191", "F811"]
# Jupyter notebook — gets scanned by ruff but isn't real source.
"Untitled.ipynb" = ["F821", "E402", "W191"]
# Project-wide PySide6 conventions: PySide6/PyQt5 method overrides
# must keep camelCase. Project-defined initModel / initView /
# initWidget also use camelCase.
"nchantdoffice/**/*.py" = [
  "F401",  # re-exports in __init__.py
  "N802",  # PySide6 method overrides
  "N806",  # cfg/db/fx/mod PySide6 convention
  "N815",  # parent/config/logger PySide6 convention
  "N803",  # self/cfg/parent arg names
  "W191",  # tabs in <(META)> doc blocks
  "F811",  # stub duplicate definitions in scaffolded code
  "N813",  # QtCore/QtGui aliased to _qc/_qg in some files
  "E741",  # variable name `l` (e.g. for layer iteration)
]
"tests/**/*.py" = [
  "F401", "N802", "N806", "N813", "N814", "N815", "N803", "W191",
]

"tests/unit/__main__TEST.py" = ["E402", "F401", "F811", "F821", "E741", "N816", "N818", "N999", "N801"]
"tests/unit/dialogs/dialogsTEST.py" = ["E402", "F401", "F811", "F821", "E741", "N816", "N818", "N999", "N801"]
