[build-system]
# Build dependencies: setuptools + wheel only. Version is declared
# statically in the [project] section below.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nchantdoffice"
version = "0.0.1.0.1.4"
#dynamic = ["version"]
description = "Desktop office automation suite built on the nchantrs framework — provides document management, calendar, contacts, browser, and tabbed workspace capabilities with PySide6."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Maintainers", email = "solubrew@solutionsbrewer.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities"]
# Dependencies - cleaned: removed Python 2 markers, Windows-only, and duplicates (keeping latest versions)
dependencies = [
    # Core utilities
    # "backoff",  # Unused - no feedparser/RSS handling
    "click",
    "six==1.16.0",  # Compatibility layer
    # "tqdm==4.68.2",  # Unused - no progress bars in nchantdoffice
    # "python-dotenv==1.2.1",  # Unused - environment loading handled elsewhere
    # "setuptools==82.0.0",  # Build tool only
    "decorator==5.3.0",  # Used by networkx/graphviz
    "diskcache==5.6.1",  # Caching system
    "dill>=0.3.9",  # Used in utilities/imports.py
    # "astor==0.8.0",  # Unused - AST manipulation not used
    # "uuid7==0.1.0",  # Unused - standard uuid used instead
    # "send2trash==2.1.0",  # Unused - no trash integration
    "psutil==7.2.1",  # System monitoring
    
    # Data processing
    "pandas==3.0.3",
    "numpy==2.4.6",
    "python-dateutil==2.8.2",
    "pytz==2026.1.post1",
    "tzdata==2026.1",
    
    # Database
    # SQLAlchemy is NOT used by nchantdoffice desktop — it uses the
    # SB internal stack (squirl + micromole) for data persistence.
    # Per the user hard rule (per-project SQLAlchemy rule): remove
    # SQLAlchemy from nchantdoffice (desktop). pyodbc is kept because
    # it may be wired by squirl / micromole through their own internal
    # SQL adapters, NOT through SQLAlchemy core/ORM.
    "pyodbc==5.2.0",

    # Crypto
    "cryptography==48.0.1",
