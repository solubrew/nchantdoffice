# @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||
# NchantdAXN Dialog Configuration
# @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||

# Task Dialog
NchantdAXNTaskDialog:
  name: Task Dialog
  description: Dialog for creating/editing AXN tasks
  dialog_cls: NchantdAXNTaskDialog
  fields:
    - id: name
      label: Task Name
      type: text
      required: true
    - id: status
      label: Status
      type: select
      options:
        - pending
        - in_progress
        - completed
        - blocked
        - cancelled
      default: pending
    - id: priority
      label: Priority
      type: select
      options:
        - {value: 1, label: Low}
        - {value: 2, label: Medium}
        - {value: 3, label: High}
        - {value: 4, label: Critical}
      default: 2
    - id: progress
      label: Progress
      type: slider
      min: 0
      max: 100
      default: 0
    - id: start_date
      label: Start Date
      type: date
    - id: end_date
      label: Due Date
      type: date
    - id: assignee
      label: Assignee
      type: text
    - id: tags
      label: Tags
      type: tags
    - id: notes
      label: Notes
      type: textarea

# Project Dialog
NchantdAXNProjectDialog:
  name: Project Dialog
  description: Dialog for creating/editing ProjectAXN projects
  dialog_cls: NchantdAXNProjectDialog
  fields:
    - id: name
      label: Project Name
      type: text
      required: true
    - id: description
      label: Description
      type: textarea
    - id: status
      label: Status
      type: select
      options:
        - planning
        - active
        - on_hold
        - completed
        - cancelled
      default: planning
    - id: start_date
      label: Start Date
      type: date
    - id: end_date
      label: End Date
      type: date
    - id: tags
      label: Tags
      type: tags
    - id: notes
      label: Notes
      type: textarea

# Link Dialog
NchantdAXNLinkDialog:
  name: Link Tasks to Project
  description: Dialog for linking AXN tasks to projects
  dialog_cls: NchantdAXNLinkDialog
  fields:
    - id: project_id
      label: Project
      type: select
      required: true
    - id: task_ids
      label: Tasks
      type: multi_select

# Progress Update Dialog
NchantdAXNProgressDialog:
  name: Update Progress
  description: Dialog for updating task progress
  dialog_cls: NchantdAXNProgressDialog
  fields:
    - id: progress
      label: Progress %
      type: slider
      min: 0
      max: 100
    - id: notes
      label: Notes
      type: textarea

# Import Dialog
NchantdAXNImportDialog:
  name: Import Tasks
  description: Dialog for importing tasks from YAML
  dialog_cls: NchantdAXNImportDialog
  fields:
    - id: import_path
      label: Import From
      type: file
      filter: "*.yaml;*.yml"
