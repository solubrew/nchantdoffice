# @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||
# NchantdAXN Configuration
# @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||

# Application Configuration
NchantdAXN:
  name: NchantdAXN
  version: 0.1.0
  description: AXN Task and ProjectAXN Project Management GUI
  app_type: gui
  window:
    title: NchantdAXN - AXN Task Manager
    width: 1200
    height: 800
    min_width: 800
    min_height: 600

# Paths
paths:
  axn_path: /home/solubrew/.arthr/workspace/axn
  shared_path: /home/solubrew/.arthr/workspace/axn
  tasks_dir: tasks
  projects_dir: projects
  links_dir: links

# Model Configuration
NchantdAXNModel:
  source: nchantdaxn
  dstruct: nchantdtree
  model_cls: NchantdAXNModel
  icon: axn-icon
  shortcuts:
    - ctrl+n: new_task
    - ctrl+shift+n: new_project
    - ctrl+i: import
    - ctrl+e: export
    - f5: refresh

# Tree Model Configuration
NchantdAXNTreeModel:
  source: nchantdaxn
  dstruct: nchantdtree
  model_cls: NchantdAXNTreeModel
  icon: tree
  root_children:
    - id: projects
      label: Projects
      icon: folder
      model: NchantdAXNProjectTabSet
    - id: tasks
      label: Tasks
      icon: checklist
      model: NchantdAXNTaskTabSet

# Tab Set Model Configuration
NchantdAXNTabSetModel:
  source: nchantdaxn
  dstruct: nchantdtabset
  model_cls: NchantdAXNTabSetModel
  default_tabs:
    - id: summary
      label: Summary
      icon: home
    - id: projects
      label: Projects
      icon: folder
    - id: tasks
      label: Tasks
      icon: checklist
    - id: timeline
      label: Timeline
      icon: timeline
    - id: milestones
      label: Milestones
      icon: flag

# AXN Integration
axn_integration:
  enabled: true
  sync_on_startup: true
  auto_backup: true
  backup_interval: 3600

# Task Defaults
task_defaults:
  status: pending
  priority: 2
  progress: 0
  duration_days: 1

# Project Defaults
project_defaults:
  status: planning
  tags: []

# UI Settings
ui:
  show_icons: true
  show_progress_bars: true
  show_due_dates: true
  confirm_delete: true
  auto_save: true
  save_interval: 300
