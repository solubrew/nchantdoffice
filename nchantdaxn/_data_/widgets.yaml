# @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||
# NchantdAXN Widget Configuration
# @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||

# Task Widget
NchantdAXNTaskWidget:
  name: Task Widget
  description: Widget for displaying individual AXN task
  widget_cls: NchantdAXNTaskWidget
  display:
    - name
    - status_icon
    - priority_icon
    - progress_bar
    - assignee
    - due_date
    - tags
  actions:
    - edit
    - delete
    - update_progress
    - mark_complete

# Project Widget
NchantdAXNProjectWidget:
  name: Project Widget
  description: Widget for displaying ProjectAXN project
  widget_cls: NchantdAXNProjectWidget
  display:
    - name
    - description
    - status_badge
    - progress_bar
    - task_count
    - milestone_count
    - dates
  actions:
    - edit
    - delete
    - view_tasks

# Task List Widget
NchantdAXNTaskListWidget:
  name: Task List
  description: Widget for displaying list of AXN tasks
  widget_cls: NchantdAXNTaskListWidget
  columns:
    - {id: status, width: 30}
    - {id: name, width: 250, sortable: true}
    - {id: priority, width: 40, sortable: true}
    - {id: progress, width: 60, sortable: true}
    - {id: assignee, width: 100, sortable: true}
    - {id: due_date, width: 80, sortable: true}
    - {id: status_label, width: 80}
  filters:
    - status
    - priority
    - assignee
  sorting:
    - priority
    - status
    - due_date
    - name

# Project List Widget
NchantdAXNProjectListWidget:
  name: Project List
  description: Widget for displaying list of projects
  widget_cls: NchantdAXNProjectListWidget
  columns:
    - {id: name, width: 200, sortable: true}
    - {id: status, width: 80, sortable: true}
    - {id: progress, width: 80, sortable: true}
    - {id: task_count, width: 50}
    - {id: milestone_count, width: 80}
    - {id: end_date, width: 80}
  filters:
    - status

# Gantt Widget
NchantdAXNGanttWidget:
  name: Gantt Chart
  description: Widget for displaying tasks in Gantt chart format
  widget_cls: NchantdAXNGanttWidget
  settings:
    show_milestones: true
    show_dependencies: true
    show_progress: true
    date_format: "%Y-%m-%d"
  row_height: 24
  header_height: 40
  bar_colors:
    pending: "#95a5a6"
    in_progress: "#3498db"
    completed: "#27ae60"
    blocked: "#e74c3c"
    cancelled: "#7f8c8d"
